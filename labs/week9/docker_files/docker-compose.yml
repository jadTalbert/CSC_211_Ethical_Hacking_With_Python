services:
  # ---------------------------------------------------------------------------
  # 1. Passive DNS Reconnaissance Target (CoreDNS)
  # Host access: 127.0.0.1:1053 (TCP/UDP) | Subnet IP: 172.29.0.53
  # ---------------------------------------------------------------------------
  acme-dns:
    image: coredns/coredns:latest
    container_name: acme-dns
    restart: unless-stopped
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./dns_config:/etc/coredns:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    networks:
      capstone-net:
        ipv4_address: 172.29.0.53

  # ---------------------------------------------------------------------------
  # 2. Student Attacker / Recon Container (VS Code Dev Containers Target)
  # Subnet IP: 172.29.0.10
  # ---------------------------------------------------------------------------
  student-recon:
    image: python:3.11-slim
    container_name: student-recon
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends iputils-ping dnsutils net-tools curl nmap &&
             pip install --no-cache-dir dnspython requests qrcode Pillow &&
             rm -rf /var/lib/apt/lists/* &&
             tail -f /dev/null"
    networks:
      capstone-net:
        ipv4_address: 172.29.0.10

  # ---------------------------------------------------------------------------
  # 3. Web Application & API Target (OWASP Juice Shop)
  # Host access: http://localhost:3000 | Subnet IP: 172.29.0.30
  # ---------------------------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      capstone-net:
        ipv4_address: 172.29.0.30

  # ---------------------------------------------------------------------------
  # 4. Banner Grabbing & Log Forensics Target (Debian + Multi-Service + Logs)
  # Subnet IP: 172.29.0.20 (SSH:22, HTTP:80, Redis:6379 + /var/log/sample_logs)
  # ---------------------------------------------------------------------------
  forensics-lab:
    image: debian:bookworm-slim
    container_name: forensics-lab
    restart: unless-stopped
    ports:
      - "2222:22"
      - "8080:80"
      - "6379:6379"
    volumes:
      - ./sample_logs:/var/log/sample_logs:ro
    command: >
      /bin/bash -c "apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server nginx redis-server python3 &&
                    mkdir -p /var/run/sshd /var/log/sample_logs &&
                    service ssh start &&
                    service nginx start &&
                    redis-server --daemonize yes --bind 0.0.0.0 --protected-mode no &&
                    rm -rf /var/lib/apt/lists/* &&
                    tail -f /dev/null"
    networks:
      capstone-net:
        ipv4_address: 172.29.0.20

networks:
  capstone-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1